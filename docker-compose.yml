services:
  postgres:
    image: postgres:16-alpine
    container_name: sulduz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sulduz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-sulduz_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sulduz-network

  bot:
    build:
      context: ./packages/bot
      dockerfile: Dockerfile
    container_name: sulduz-bot
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      ADMIN_IDS: ${ADMIN_IDS}
      PANEL_BASE_URL: ${PANEL_BASE_URL}
      PANEL_USERNAME: ${PANEL_USERNAME}
      PANEL_PASSWORD: ${PANEL_PASSWORD}
      PANEL_INBOUND_ID: ${PANEL_INBOUND_ID}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      TZ: ${TZ:-Asia/Tehran}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      MUSIC_DIR: /app/data/music
      # سرویس ویس‌کال فقط داخل شبکهٔ داکر است؛ هیچ پورتی روی سرور باز نمی‌شود
      VOICE_URL: http://sulduz-voice:8077
    extra_hosts:
      - "api.telegram.org:149.154.166.110"
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - downloads:/tmp/sulduz-downloads
      - ./data:/app/data
    networks:
      - sulduz-network

  voice:
    build:
      context: ./packages/voice
      dockerfile: Dockerfile
    container_name: sulduz-voice
    restart: unless-stopped
    environment:
      VOICE_PORT: 8077
      VOICE_HOME: /app/voice
      MUSIC_DIR: /app/music
      # این‌ها فقط پیش‌فرض‌اند؛ مقدار واقعی از تنظیمات پنل (voicecall_*) خوانده می‌شود
      VOICE_MAX_STREAMS: ${VOICE_MAX_STREAMS:-5}
      VOICE_AUDIO_QUALITY: ${VOICE_AUDIO_QUALITY:-high}
      VOICE_VOLUME: ${VOICE_VOLUME:-100}
      VOICE_AUTO_START: ${VOICE_AUTO_START:-1}
      TZ: ${TZ:-Asia/Tehran}
    # پورت 8077 منتشر نمی‌شود: تنها bot به آن دسترسی دارد
    expose:
      - "8077"
    volumes:
      # کلید API، سشن‌ها و حساب‌ها — بیرون از دیتابیس و بیرون از مخزن git
      - ./data/voice:/app/voice
      # کتابخانهٔ آهنگ‌ها فقط خوانده می‌شود
      - ./data/music:/app/music:ro
    networks:
      - sulduz-network

  admin:
    build:
      context: ./packages/admin
      dockerfile: Dockerfile
    container_name: sulduz-admin
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "9090:80"
    networks:
      - sulduz-network

volumes:
  postgres_data:
  downloads:

networks:
  sulduz-network:
    driver: bridge
